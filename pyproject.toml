[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-limma"
version = "0.1.1"
description = "Pure-Python port of Bioconductor limma — linear models & empirical-Bayes moderated statistics for differential expression (voom, lmFit, eBayes, topTable)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "limma", "differential-expression", "voom", "eBayes",
    "linear-models", "empirical-bayes", "RNA-seq", "microarray",
    "proteomics", "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "patsy>=0.5",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/omicverse/py-limma"
Repository = "https://github.com/omicverse/py-limma"
Issues = "https://github.com/omicverse/py-limma/issues"
"Upstream Bioc package" = "https://bioconductor.org/packages/release/bioc/html/limma.html"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["pylimma*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
